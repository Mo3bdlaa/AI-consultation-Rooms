<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Consultation Rooms</title>
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --panel2:#334155; --text:#e2e8f0; --muted:#94a3b8; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); height:100vh; display:flex; flex-direction:column; }
  header { padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--panel2); }
  header h1 { margin:0; font-size:18px; }
  header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
  .setup { padding:14px 20px; background:var(--panel); border-bottom:1px solid var(--panel2);
           display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .setup label { display:flex; flex-direction:column; font-size:12px; color:var(--muted); gap:4px; }
  .setup input { background:var(--bg); border:1px solid var(--panel2); color:var(--text);
                 padding:8px 10px; border-radius:8px; font-size:14px; }
  #topic { width:260px; } #details { width:300px; } #rounds { width:64px; } #key { width:220px; }
  button { background:#2563eb; color:#fff; border:0; padding:10px 18px; border-radius:8px;
           font-size:14px; cursor:pointer; font-weight:600; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .main { flex:1; display:flex; min-height:0; }
  .chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .side { width:280px; border-left:1px solid var(--panel2); background:var(--panel); padding:16px; overflow-y:auto; }
  .side h3 { margin:0 0 10px; font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
  .msg { display:flex; gap:10px; max-width:82%; }
  .avatar { width:34px; height:34px; border-radius:50%; flex-shrink:0; display:flex;
            align-items:center; justify-content:center; font-weight:700; color:#fff; font-size:14px; }
  .bubble { background:var(--panel); border-radius:12px; padding:10px 14px; }
  .bubble .who { font-size:12px; font-weight:700; margin-bottom:3px; }
  .bubble .who span { color:var(--muted); font-weight:400; }
  .bubble .body { font-size:14px; line-height:1.5; white-space:pre-wrap; }
  .search-note { font-size:12px; color:#fbbf24; font-style:italic; margin:4px 0 0; }
  .system { align-self:center; color:var(--muted); font-size:12px; background:var(--panel2);
            padding:5px 12px; border-radius:20px; text-align:center; }
  .system.ok { background:#064e3b; color:#6ee7b7; }
  .bid { margin-bottom:10px; }
  .bid .row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:3px; }
  .bid .reason { font-size:11px; color:var(--muted); }
  .bar { height:6px; background:var(--bg); border-radius:3px; overflow:hidden; }
  .bar > div { height:100%; transition:width .3s; }
  .bid.winner { outline:2px solid #fbbf24; border-radius:8px; padding:6px; margin:-6px -6px 10px; }
  .decision { align-self:stretch; background:#0c4a6e; border:1px solid #0ea5e9; border-radius:12px;
              padding:16px; white-space:pre-wrap; font-size:14px; line-height:1.6; }
  .decision h2 { margin:0 0 8px; font-size:15px; }
  .typing { display:inline-block; width:8px; height:14px; background:var(--text); margin-left:2px;
            animation:blink 1s steps(2) infinite; vertical-align:middle; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

  /* --- Mobile: stack the panels instead of placing them side-by-side --- */
  @media (max-width: 760px) {
    header p { font-size:12px; }
    .setup { padding:12px; gap:8px; }
    .setup label { width:100%; }
    .setup input,
    #topic, #details, #rounds, #key { width:100%; }
    .setup button { width:100%; padding:12px; }
    .main { flex-direction:column; }
    .side {
      order:-1;              /* raised hands above the chat */
      width:auto;
      border-left:none;
      border-bottom:1px solid var(--panel2);
      max-height:32vh;
      padding:12px 14px;
    }
    .chat { padding:14px; }
    .msg { max-width:100%; }
  }
</style>
</head>
<body>
  <header>
    <h1>🪑 AI Consultation Rooms</h1>
    <p>Personas debate your topic, search the web, challenge each other, and stop when they reach consensus.</p>
  </header>

  <div class="setup">
    <label>OpenRouter API key
      <input id="key" type="password" placeholder="sk-or-v1-..." />
    </label>
    <label>Topic
      <input id="topic" placeholder="e.g. Mobile app or web app first?" />
    </label>
    <label>Details (optional)
      <input id="details" placeholder="Context, constraints, goals..." />
    </label>
    <label>Max rounds
      <input id="rounds" type="number" value="10" min="2" max="20" />
    </label>
    <button id="start">Start meeting</button>
  </div>

  <div class="main">
    <div class="chat" id="chat"></div>
    <div class="side">
      <h3>🙋 Raised hands (this round)</h3>
      <div id="bids"></div>
    </div>
  </div>

<script>
const chat = document.getElementById('chat');
const bidsEl = document.getElementById('bids');
const startBtn = document.getElementById('start');
const keyEl = document.getElementById('key');
keyEl.value = localStorage.getItem('or_key') || '';

let participants = {};
let currentBody = null, currentCursor = null;
let running = false;

function clear(){ chat.innerHTML=''; bidsEl.innerHTML=''; participants={}; }
function scroll(){ chat.scrollTop = chat.scrollHeight; }
function sys(text, ok){ const d=document.createElement('div'); d.className='system'+(ok?' ok':'');
  d.textContent=text; chat.appendChild(d); scroll(); }

function startBubble(p){
  const wrap=document.createElement('div'); wrap.className='msg';
  const av=document.createElement('div'); av.className='avatar'; av.style.background=p.color; av.textContent=p.name[0];
  const bub=document.createElement('div'); bub.className='bubble';
  bub.innerHTML=`<div class="who" style="color:${p.color}">${p.name} <span>· ${p.role}</span></div>`;
  const body=document.createElement('div'); body.className='body';
  const cursor=document.createElement('span'); cursor.className='typing'; body.appendChild(cursor);
  bub.appendChild(body); wrap.appendChild(av); wrap.appendChild(bub); chat.appendChild(wrap); scroll();
  currentBody=body; currentCursor=cursor; window._bub=bub;
}
function searchNote(query){
  if(!window._bub) return;
  const n=document.createElement('div'); n.className='search-note'; n.textContent='🔎 searched the web: "'+query+'"';
  window._bub.appendChild(n); scroll();
}
function appendToken(t){ if(currentBody) currentCursor.insertAdjacentText('beforebegin', t); scroll(); }
function endBubble(){ if(currentCursor) currentCursor.remove(); currentBody=null; currentCursor=null; }

function renderBids(bids){
  bidsEl.innerHTML='';
  const sorted=[...bids].sort((a,b)=>b.effective-a.effective);
  const winner=sorted[0].id;
  sorted.forEach(b=>{
    const d=document.createElement('div'); d.className='bid'+(b.id===winner?' winner':'');
    d.innerHTML=`<div class="row"><span style="color:${b.color};font-weight:600">${b.name}</span>
      <span>${b.urgency}/10</span></div>
      <div class="bar"><div style="width:${b.urgency*10}%;background:${b.color}"></div></div>
      <div class="reason">${b.reason||''}</div>`;
    bidsEl.appendChild(d);
  });
}
function decisionBox(){
  const d=document.createElement('div'); d.className='decision';
  d.innerHTML='<h2>✅ Facilitator decision</h2><div class="dbody"></div>';
  chat.appendChild(d); scroll(); return d.querySelector('.dbody');
}

// --- Parse an SSE stream coming back from a fetch() POST ---
async function streamPost(url, body, onEvent){
  const res = await fetch(url, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'X-OpenRouter-Key': keyEl.value.trim() },
    body: JSON.stringify(body)
  });
  if(!res.ok){ throw new Error('HTTP '+res.status); }
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf='';
  while(true){
    const {value, done} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let idx;
    while((idx = buf.indexOf('\n\n')) >= 0){
      const raw = buf.slice(0, idx); buf = buf.slice(idx+2);
      let ev='message', data='';
      raw.split('\n').forEach(line=>{
        if(line.startsWith('event:')) ev=line.slice(6).trim();
        else if(line.startsWith('data:')) data+=line.slice(5).trim();
      });
      if(data) onEvent(ev, JSON.parse(data));
    }
  }
}

const PERSONAS_META = [
  {id:'maya',name:'Maya',role:'Pragmatic Product Lead',color:'#2563eb'},
  {id:'karim',name:'Karim',role:'Skeptical Engineer',color:'#dc2626'},
  {id:'lina',name:'Lina',role:'Visionary',color:'#7c3aed'},
  {id:'omar',name:'Omar',role:'Data & Cost Analyst',color:'#059669'},
];
PERSONAS_META.forEach(p=>participants[p.id]=p);

async function runMeeting(){
  const topic = document.getElementById('topic').value.trim();
  if(!topic){ alert('Enter a topic'); return; }
  if(!keyEl.value.trim()){ alert('Paste your OpenRouter API key'); return; }
  localStorage.setItem('or_key', keyEl.value.trim());
  const details = document.getElementById('details').value.trim();
  const total = parseInt(document.getElementById('rounds').value)||10;

  running=true; startBtn.disabled=true; startBtn.textContent='Meeting in progress…';
  clear();
  sys('Meeting started · '+PERSONAS_META.map(p=>p.name).join(', '));

  let history=[];
  let reachedConsensus=false;

  try {
    for(let round=1; round<=total && running; round++){
      sys(`— Round ${round} of ${total} —`);
      let verdict={consensus:false};
      let turnText='', turnSpeaker=null;

      await streamPost('/api/step',
        {topic, details, history, round, total},
        (ev, data)=>{
          if(ev==='bids') renderBids(data.bids);
          else if(ev==='turn_start'){ startBubble(participants[data.id]||data); turnSpeaker=data.name; }
          else if(ev==='searching') searchNote(data.query);
          else if(ev==='token') appendToken(data.text);
          else if(ev==='turn_end'){ endBubble(); turnText=data.text; turnSpeaker=data.name; }
          else if(ev==='verdict') verdict=data;
          else if(ev==='error'){ throw new Error(data.message); }
        });

      if(turnSpeaker && turnText) history.push({name:turnSpeaker, text:turnText});

      if(verdict.consensus){
        reachedConsensus=true;
        sys('🤝 Consensus reached — '+(verdict.reason||''), true);
        break;
      }
    }

    if(!reachedConsensus) sys('Round limit reached — closing out.');

    sys('Facilitator is writing the decision…');
    const box = decisionBox();
    await streamPost('/api/decision', {topic, details, history}, (ev, data)=>{
      if(ev==='decision_token') box.textContent += data.text;
      else if(ev==='error') box.textContent = '⚠️ '+data.message;
      scroll();
    });
    sys('Meeting ended.', true);
  } catch(e){
    sys('⚠️ '+e.message);
  } finally {
    running=false; startBtn.disabled=false; startBtn.textContent='Start meeting';
  }
}

startBtn.onclick = runMeeting;
</script>
</body>
</html>
